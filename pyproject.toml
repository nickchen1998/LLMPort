[tool.poetry]
name = "llmport"
version = "0.1.0"
description = "在 Mac mini 上以 MLX 部署本地模型，提供 OpenAI 相容 API 與會員、金鑰、監控後台"
authors = ["Nick Chen <nickchen1998@gmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = ">=0.116"
uvicorn = { extras = ["standard"], version = ">=0.35" }
sqlalchemy = ">=2.0.42,<2.1"
alembic = "^1.16"
psycopg2-binary = "^2.9.9"
redis = ">=6.3"
python-dotenv = "^1.1"
python-multipart = ">=0.0.20"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
bcrypt = ">=4.2"
httpx = ">=0.27,<1.0"
psutil = ">=6.0"
huggingface-hub = ">=0.34"
pillow = ">=11"

# 真的跑模型時才需要（Apple Silicon）：poetry install --with mlx
[tool.poetry.group.mlx]
optional = true

[tool.poetry.group.mlx.dependencies]
mlx = ">=0.29"
mlx-lm = ">=0.28"
mlx-vlm = ">=0.3"
mlx-embeddings = ">=0.0.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = ">=0.24"
fakeredis = ">=2.26"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
